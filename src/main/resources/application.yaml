server:
  port: ${PORT:8080}          # Cloud Run inyecta PORT
  shutdown: graceful

spring:
  application:
    name: finance
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/users_db?serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false}
    username: user
    password: password

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none          # el esquema lo gestiona Flyway
    properties:
      hibernate:
        default_batch_fetch_size: 50
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
